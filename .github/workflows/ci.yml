name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t visualmic-ci .

      - name: Lint
        run: docker run --rm --entrypoint "" visualmic-ci ruff check .

      - name: Tests
        run: docker run --rm --entrypoint "" visualmic-ci python -m pytest tests -q

      - name: Verify --help
        run: docker run --rm visualmic-ci --help

      - name: Verify --version
        run: docker run --rm visualmic-ci --version
