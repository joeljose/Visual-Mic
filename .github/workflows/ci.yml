name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker image
        run: docker build -t visualmic-ci .

      - name: Lint
        run: docker run --rm --entrypoint "" visualmic-ci ruff check .

      - name: Tests
        run: docker run --rm --entrypoint "" visualmic-ci python -m pytest tests -q

      - name: Verify --help
        run: docker run --rm visualmic-ci --help

      - name: Verify --version
        run: docker run --rm visualmic-ci --version

  # Runs the PyTorch path (extract_audio_gpu) on a CPU-only PyTorch build, so
  # the GPU code is tested on every push without a GPU or the CUDA image.
  pytorch-path-on-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install torch==2.1.2 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-gpu.txt -r requirements.txt -r requirements-dev.txt
          SHA=$(grep -oP 'PYTORCH_WAVELETS_SHA=\K\w+' Dockerfile.gpu)
          pip install --no-deps "https://github.com/fbcotter/pytorch_wavelets/archive/${SHA}.tar.gz"

      - name: Tests (NumPy and PyTorch paths)
        run: python -m pytest tests -q

